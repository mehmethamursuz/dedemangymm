<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mehmet'in Proje Ödevi - Dedeman Gym</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: rgba(255, 255, 255, 0.03);
            --neon-color: #ccff00;
            --text-color: #ffffff;
            --text-gray: #8a8f98;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            background: rgba(13, 15, 18, 0.8);
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .logo span {
            color: var(--neon-color);
        }

        nav a {
            color: var(--text-color);
            text-decoration: none;
            margin-left: 20px;
            font-weight: 500;
            transition: 0.3s;
        }

        nav a:hover {
            color: var(--neon-color);
        }

        .hero {
            height: 75vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            margin-top: 60px;
            background: radial-gradient(circle at center, rgba(204, 255, 0, 0.05) 0%, transparent 70%);
        }

        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
            font-weight: 900;
        }

        .hero p {
            color: var(--text-gray);
            font-size: 1.2rem;
            max-width: 600px;
            margin-bottom: 30px;
        }

        section {
            padding: 80px 8%;
        }

        .section-title {
            font-size: 2rem;
            margin-bottom: 40px;
            text-align: center;
        }

        .section-title span {
            color: var(--neon-color);
        }

        .auth-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        .auth-box {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 35px;
            width: 100%;
            max-width: 400px;
            backdrop-filter: blur(5px);
        }

        .auth-box h3 {
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: var(--neon-color);
            text-align: center;
        }

        .welcome-box {
            background: var(--card-bg);
            border: 1px solid var(--neon-color);
            border-radius: 20px;
            padding: 40px
